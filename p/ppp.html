<!DOCTYPE html>
<html lang="en-in">
    <head>
        <meta charset="UTF-8">
        <title>PRATHAM DADA| DHANBAD JHARKHAND</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Google Fonts: Poppins -->
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
        
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background-color: black;
                color: white;
                font-family: 'Poppins', sans-serif;
                text-align: center;
            }
            .header-title {
                position: absolute;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 600px;
                background: rgba(0, 0, 0, 0.65);
                padding: 15px 20px;
                border-radius: 12px;
                backdrop-filter: blur(8px);
                border: 1px solid rgba(255, 255, 255, 0.15);
                z-index: 10;
            }
            .header-title h1 {
                font-size: 1.2rem;
                font-weight: 600;
                letter-spacing: 0.5px;
            }
            .img-container {
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: flex-start;
            }
            .img-container img {
                width: 100%;
                height: auto; /* Photo ki poori height dikhegi, kabhi cut nahi hogi */
                display: block;
            }
        </style>
    </head>
    <body>

        <div class="header-title">
            <h1>PRATHAM DADA | DHANBAD JHARKHAND</h1>
        </div>

        <div class="img-container">
            <!-- dhanbad.jpg aapke folder me honi chahiye -->
            <img src="dhanbad.jpg" alt="Dhanbad Citi Bazar">
        </div>

    </body>
</html>
